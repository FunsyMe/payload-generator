name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26'

      - name: Windows EXE
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
          TAG: ${{ github.event.inputs.tag }}
        run: |
          go mod download
          go build -ldflags="-s -w -X main.version=$TAG" -o "payload-generator-$TAG.exe"

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          files: payload-generator-${{ github.event.inputs.tag }}.exe
